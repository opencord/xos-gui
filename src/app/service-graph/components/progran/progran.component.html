<h1>Progran</h1>

<div class="col-sm-6" ng-repeat="slice in vm.slices">
  <h2 class="text-center">
    <span class="pe-7s-signal"></span>
    {{slice.name}}
  </h2>
  <div class="row">
    <div class="col-sm-6">
      <div class="panel panel-filled text-center">
        <div class="panel-body">
          <h2 class="m-b-none">
            <span class="slight" ng-click="vm.speedDown(slice, 'DlAllocRBRate')">
              <i class="fa fa-play fa-rotate-90 text-warning"> </i>
            </span>
            {{slice.DlAllocRBRate}}
            <span class="slight" ng-click="vm.speedUp(slice, 'DlAllocRBRate')">
              <i class="fa fa-play fa-rotate-270 text-warning"> </i>
            </span>
          </h2>
          <div class="small">Download</div>
        </div>
      </div>
    </div>
    <div class="col-sm-6">
      <div class="panel panel-filled text-center">
        <div class="panel-body">
          <h2 class="m-b-none">
            <span class="slight" ng-click="vm.speedDown(slice, 'UlAllocRBRate')">
              <i class="fa fa-play fa-rotate-90 text-warning"> </i>
            </span>
            {{slice.UlAllocRBRate}}
            <span class="slight" ng-click="vm.speedUp(slice, 'UlAllocRBRate')">
              <i class="fa fa-play fa-rotate-270 text-warning"> </i>
            </span>
          </h2>
          <div class="small">Upload</div>
        </div>
      </div>
    </div>
  </div>
</div>
