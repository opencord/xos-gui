<div class="row">
  <div class="col-xs-12">
    <h1>Notifications</h1>
    <div class="alert alert-info" ng-hide="vm.notifsLoaded">
      Loading Notifications...
    </div>
    <div class="alert alert-info" ng-show="vm.notifications.length == 0 && vm.notifsLoaded">
      There are no notifications right now. You may need to wait for them to load.
    </div>
    <div class="alert" ng-repeat="notif in vm.notificationSlice" ng-class="vm.getClass(notif.notification_code)">
      {{notif.notification_msg}}
      <div class="pull-right">
        {{notif.timeformat}}
      </div>
    </div>
  
    <xos-pagination
      page-size="25"
      total-elements="vm.notifications.length"
      change="vm.goToPage"
    >
    </xos-pagination>
  </div>
</div>
