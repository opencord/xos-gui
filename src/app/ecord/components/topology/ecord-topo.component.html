<div map-lazy-load="https://maps.google.com/maps/api/js">
    <ng-map
        styles="{{vm.mapStyles}}"
        disable-default-u-i="true"
    >
        <marker
            ng-repeat="marker in vm.cos"
            icon="app/images/co.png"
            position="{{marker.position}}"
            title="{{marker.name}}"
            animation="Animation.DROP"
            on-click="vm.markerClick(marker)">
        </marker>
        <shape
            ng-repeat="line in vm.connections"
            name="polyline"
            id="{{$index}}"
            path="{{line.path}}"
            geodesic="true"
            stroke-color="{{vm.getLineColor(line.model.status, $index)}}"
            stroke-opacity="1.0"
            stroke-weight="2"
            on-click="vm.lineClick(line)">
    </ng-map>
</div>
