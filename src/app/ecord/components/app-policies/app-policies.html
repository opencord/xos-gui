<div class="row text-center">
    <div class="col-xs-12">
        <h1>Application Policies</h1>
    </div>
</div>
<div class="row text-center" style="margin-top: 40px;">
    <div class="col-xs-6">
        <h3>Fast path:</h3>
    </div>
    <div class="col-xs-6">
        <h3>Slow path:</h3>
    </div>
</div>
<div class="row" style="margin-top: 20px;">
    <div class="col-xs-6 droppable text-center">
        <div class="drop-area" droppable>
            <div
                draggable
                class="btn btn-info btn-block btn-draggable"
                ng-repeat="item in vm.fast">{{item}}</div>
        </div>
    </div>
    <div class="col-xs-6 droppable text-center">
        <div class="drop-area" droppable>
            <div
                draggable
                class="btn btn-info btn-block btn-draggable"
                ng-repeat="item in vm.slow">{{item}}</div>
        </div>
    </div>
</div>
