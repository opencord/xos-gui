<script type="text/ng-template" id="onosModal.html">
    <div class="modal-header">
        <h3 class="modal-title">ONOS Config</h3>
    </div>
    <div class="modal-body">
        <xos-form ng-model="$ctrl.xranCfg" config="$ctrl.config"></xos-form>
    </div>
</script>

<div class="row">
    <div class="col-xs-offset-2 col-xs-8">
        <div class="row text-center">
            <div class="col-xs-6">
                <a class="btn btn-lg btn-block"
                   ng-class="{'btn-accent': vm.config.association !== 'signal', 'btn-accent-active': vm.config.association === 'signal'}"
                   ng-click="vm.setAssociation('signal')">
                    Signal Based Association
                </a>
                <a class="btn btn-lg btn-block"
                   ng-class="{'btn-accent': vm.config.association !== 'load', 'btn-accent-active': vm.config.association === 'load'}"
                   ng-click="vm.setAssociation('load')">
                    Load Based Association
                </a>
            </div>
            <div class="col-xs-6">
                <a class="btn btn-lg btn-block"
                   ng-class="{'btn-accent': vm.config.logic, 'btn-accent-active': !vm.config.logic}"
                   ng-click="vm.setLogic(false)">
                    Scheduling logic: Off
                </a>
                <a class="btn btn-lg btn-block"
                   ng-class="{'btn-accent': !vm.config.logic, 'btn-accent-active': vm.config.logic}"
                   ng-click="vm.setLogic(true)">
                    Scheduling logic: On
                </a>
            </div>
        </div>
        <div class="row text-center">
            <div class="col-xs-2 bar-container">
                <div class="label left">Resource Allocation</div>
                <div class="bar" id="leftBar"></div>
            </div>
            <div class="col-xs-4">
                <ng-gauge size="150" type="full" thick="5" min="0" max="100" value="vm.gauges.left" cap="round" label="Resource Utilization"  foreground-color="#f6a821" background-color="rgba(255,255,255, 0.4)" append="%"></ng-gauge>
            </div>
            <div class="col-xs-4">
                <ng-gauge size="150" type="full" thick="5" min="0" max="100" value="vm.gauges.right" cap="round" label="Resource Utilization"  foreground-color="#f6a821" background-color="rgba(255,255,255, 0.4)" append="%"></ng-gauge>
            </div>
            <div class="col-xs-2 bar-container">
                <div class="label right">Resource Allocation</div>
                <div class="bar" id="rightBar"></div>
            </div>
        </div>
        <div class="row">
            <div class="col-xs-12">
                <svg id="xran"></svg>
            </div>
        </div>
    </div>
</div>
